name: WDSM Visualization Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/wdsm_visualization.html"
      - "docs/wdsm_visualization_data.json"
      - "docs/wdsm_completion_audit.md"
      - "docs/wdsm_lean_formalization_plan.md"
      - "artifacts/wdsm_formalization_pilot.json"
      - "scripts/build_wdsm_visualization.py"
      - ".github/workflows/wdsm-visualization-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild WDSM visualization
        run: python3 scripts/build_wdsm_visualization.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
