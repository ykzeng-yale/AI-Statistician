[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-statistician"
version = "0.1.0"
description = "Agentic AI statistician prototype with simulation and Lean proof verification hooks"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
proof = [
  "axle",
  "python-dotenv",
]
llm = [
  "anthropic",
]
test = [
  "pytest>=8",
]

[project.scripts]
ai-statistician = "ai_statistician.cli:main"

[tool.setuptools.packages.find]
include = ["ai_statistician*"]

[tool.setuptools.package-data]
ai_statistician = ["policies/*.json", "runtime_assets/*.mjs"]
